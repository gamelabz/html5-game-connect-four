<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connect Four</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="topbar">
      <h1>🔴 Connect Four</h1>
      <p class="tagline">Drop discs and line up four in a row.</p>
    </header>

    <section class="hud" aria-label="Game statistics">
      <div class="stat"><span class="stat-label">You</span><span class="stat-value" id="you">Red</span></div>
      <div class="stat"><span class="stat-label">Status</span><span class="stat-value" id="status">Your move</span></div>
      <div class="stat"><span class="stat-label">AI</span><span class="stat-value" id="ai">Yellow</span></div>
    </section>

    <div class="stage">
      <canvas id="game" width="420" height="360"></canvas>
      <p class="message" id="message">Click a column to drop your disc.</p>
    </div>

    <footer class="controls">
      <button class="btn" id="new">New Game</button>
    </footer>
  </main>

  <script src="game.js"></script>
</body>
</html>
